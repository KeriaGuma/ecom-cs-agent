name: Sandbox validation
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints-sandbox.txt
      - run: python -m pip install -r requirements.txt
      - name: Run offline suite
        run: python -m pytest -q
      - name: Build and start sandbox
        run: |
          docker compose build sandbox
          docker compose up --no-build --detach --wait --wait-timeout 60
      - name: Verify the running image and persistent volume
        run: python -m bench.sandbox_smoke --compose
      - name: Sandbox logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the temporary stack
        if: always()
        run: docker compose down --volumes
